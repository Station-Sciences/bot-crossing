[package]
name = "bot-crossing"
version = "1.0.0"
description = "A 3D colony sim where every coding-agent thread is an astronaut."
authors = ["Jarren Rocks"]
license = "MIT"
repository = "https://github.com/jarrenrocks/bot-crossing"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
